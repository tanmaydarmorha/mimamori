name: ci-conversation-svc
on:
  push:
    branches: [main]
    paths: [services/conversation-svc/**, libs/mimamori-common/**, schemas/**, .github/workflows/ci-conversation-svc.yml, .github/workflows/_build-deploy.yml]
  pull_request:
    paths: [services/conversation-svc/**, libs/mimamori-common/**, schemas/**, .github/workflows/ci-conversation-svc.yml, .github/workflows/_build-deploy.yml]
  workflow_dispatch:
concurrency:
  group: ci-conversation-svc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    # A called workflow can only use permissions its caller grants (deploy needs id-token for WIF).
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_build-deploy.yml
    with:
      name: conversation-svc
      path: services/conversation-svc
      kind: service
    secrets: inherit
