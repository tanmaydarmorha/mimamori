name: ci-core-bank-mock
on:
  push:
    branches: [main]
    paths: [services/core-bank-mock/**, libs/mimamori-common/**, seed/**, .github/workflows/ci-core-bank-mock.yml, .github/workflows/_build-deploy.yml]
  pull_request:
    paths: [services/core-bank-mock/**, libs/mimamori-common/**, seed/**, .github/workflows/ci-core-bank-mock.yml, .github/workflows/_build-deploy.yml]
  workflow_dispatch:
concurrency:
  group: ci-core-bank-mock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: ./.github/workflows/_build-deploy.yml
    with:
      name: core-bank-mock
      path: services/core-bank-mock
      kind: service
    secrets: inherit
