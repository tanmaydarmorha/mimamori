name: ci-intel-job
on:
  push:
    branches: [main]
    paths: [jobs/intel-job/**, libs/mimamori-common/**, schemas/**, .github/workflows/ci-intel-job.yml, .github/workflows/_build-deploy.yml]
  pull_request:
    paths: [jobs/intel-job/**, libs/mimamori-common/**, schemas/**, .github/workflows/ci-intel-job.yml, .github/workflows/_build-deploy.yml]
  workflow_dispatch:
concurrency:
  group: ci-intel-job-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: ./.github/workflows/_build-deploy.yml
    with:
      name: intel-job
      path: jobs/intel-job
      kind: job
    secrets: inherit
