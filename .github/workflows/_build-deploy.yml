# Reusable workflow called by every ci-<name>.yml.
# Test -> docker build (repo root as context) -> push + deploy to Cloud Run (only when GCP is configured).
name: _build-deploy
on:
  workflow_call:
    inputs:
      name: {type: string, required: true}
      path: {type: string, required: true}
      kind: {type: string, required: true, description: "service | job"}

env:
  REGION: ${{ vars.MIMAMORI_REGION || 'asia-south1' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect project type
        id: detect
        run: |
          if [ -f "${{ inputs.path }}/package.json" ]; then echo "type=node" >> "$GITHUB_OUTPUT"; else echo "type=python" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.type == 'python'
        with: {python-version: "3.12"}
      - name: Python tests
        if: steps.detect.outputs.type == 'python'
        run: |
          python -m pip install -e "libs/mimamori-common[web,dev]" -e "${{ inputs.path }}[dev]"
          python -m pytest "${{ inputs.path }}/tests"
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.type == 'node'
        with: {node-version: "24"}
      - name: Node tests and build
        if: steps.detect.outputs.type == 'node'
        working-directory: ${{ inputs.path }}
        run: |
          npm ci
          npm test --if-present
          npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build (context = repo root)
        run: docker build -f "${{ inputs.path }}/Dockerfile" -t "mimamori-${{ inputs.name }}:${{ github.sha }}" .

  # Deploy runs only on main and only once the GCP project exists (infra/README.md): set the repository
  # variables GCP_PROJECT_ID, GCP_PROJECT_NUMBER, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT,
  # GCP_ARTIFACT_REPO (infra/setup.sh prints them).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ inputs.name }}:${{ github.sha }}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f "${{ inputs.path }}/Dockerfile" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy
        # Cloud settings live here, so every deploy is complete (infra/README.md, "Cloud Run").
        # Backends: internal ingress only, no invoker check (plain HTTP from nginx and between services;
        # the network is the boundary). Everything egresses through the default VPC, so calls to *.run.app
        # count as internal. At most one instance each (SSE fan-out, call state and the bank mock live in memory),
        # scaled to zero when idle so an unused prototype costs nothing; the first request after idle is a cold start.
        env:
          NAME: ${{ inputs.name }}
          KIND: ${{ inputs.kind }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
        run: |
          url() { echo "https://$1-${NUMBER}.${REGION}.run.app"; }
          ENVS="MIMAMORI_ENV=cloud,MIMAMORI_REGION=${REGION},MIMAMORI_PROJECT_ID=${PROJECT},GOOGLE_CLOUD_PROJECT=${PROJECT}"
          ENVS="${ENVS},MIMAMORI_SERVICE=${NAME},MIMAMORI_SPEECH=typed,MIMAMORI_TTS=cloud,MIMAMORI_DEMO_NOW=2026-10-13T11:42:00+09:00"
          ENVS="${ENVS},MIMAMORI_COPILOT_BACKEND=gemini,MIMAMORI_GENERAL_BACKEND=gemini,GEMINI_MODEL=gemini-2.5-flash"
          ENVS="${ENVS},MIMAMORI_GEMINI_THINKING_BUDGET=0,MIMAMORI_MODEL_TIMEOUT_S=60"
          ENVS="${ENVS},CORE_BANK_URL=$(url core-bank-mock),SCORING_URL=$(url scoring)"
          ENVS="${ENVS},CASE_SVC_URL=$(url case-svc),CONVERSATION_SVC_URL=$(url conversation-svc)"
          COMMON=(--image "$IMAGE" --region "$REGION" --project "$PROJECT" --set-env-vars "$ENVS"
                  --service-account "${NAME}@${PROJECT}.iam.gserviceaccount.com"
                  --network default --subnet default --vpc-egress all-traffic)
          if [ "$KIND" = "job" ]; then
            gcloud run jobs deploy "$NAME" "${COMMON[@]}"
          elif [ "$NAME" = "web-ui" ]; then
            gcloud run deploy "$NAME" "${COMMON[@]}" --ingress all --allow-unauthenticated \
              --min-instances 0 --max-instances 2 --timeout 3600
          else
            gcloud run deploy "$NAME" "${COMMON[@]}" --ingress internal --no-invoker-iam-check \
              --min-instances 0 --max-instances 1 --no-cpu-throttling --timeout 3600
          fi
