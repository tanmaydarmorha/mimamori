[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-job"
version = "0.1.0"
description = "Simulation job: synthetic-only three-way evaluation (today's counter check / statistics only / Mimamori) and held-out failure analysis"
requires-python = ">=3.12"
dependencies = ["mimamori-common", "httpx>=0.27"]

[project.optional-dependencies]
# fastapi is only needed for the in-package fake services (--fake-services, tests).
dev = ["pytest>=8", "fastapi>=0.110"]
fake = ["fastapi>=0.110"]

[project.scripts]
sim-job = "sim_job.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sim_job = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
