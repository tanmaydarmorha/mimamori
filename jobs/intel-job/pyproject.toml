[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimamori-intel-job"
version = "0.1.0"
description = "Scheduled job: public scam alerts -> pending playbooks in intel-db"
requires-python = ">=3.12"
dependencies = ["mimamori-common", "jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
intel-job = "intel_job.__main__:main"

[tool.setuptools.packages.find]
include = ["intel_job*"]

[tool.setuptools.package-data]
intel_job = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
