[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "core-bank-mock"
version = "0.1.0"
description = "Mock core banking for Mimamori: synthetic ledger, transfers, holds, freezes"
requires-python = ">=3.12"
dependencies = ["mimamori-common[web]", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "mimamori-common[dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
