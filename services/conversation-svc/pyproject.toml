[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-svc"
version = "0.1.0"
description = "Mimamori conversation service: family notice and verified callback (no case-db access)"
requires-python = ">=3.12"
dependencies = ["mimamori-common[web]", "websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not ollama'"
markers = ["ollama: needs a local Ollama with gemma4:12b (manual check, skipped by default)"]
