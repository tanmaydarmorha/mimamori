[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimamori-scoring"
version = "0.1.0"
description = "Mimamori scoring: baselines, smart limits, counterpart graph, watchlist matching. No LLM."
requires-python = ">=3.12"
dependencies = ["mimamori-common[web]", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
