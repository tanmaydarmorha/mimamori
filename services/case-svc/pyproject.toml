[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "case-svc"
version = "0.1.0"
description = "Mimamori case service: counter copilot, investigation agent, decisions, family-call brief, analyst approvals"
requires-python = ">=3.12"
dependencies = [
  "mimamori-common",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "google-adk>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
case_svc = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not ollama'"
markers = ["ollama: needs a local Ollama with gemma4:12b (manual check, skipped by default)"]
